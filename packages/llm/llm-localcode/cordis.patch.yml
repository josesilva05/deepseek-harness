# Optional Profile Bundle: register the `localcode` route for the localcode API
# on this machine, this machine's own inference engine. The served model is read
# from the running API. `start-api.bat --harness` sets LOCALCODE_BASE_URL for the
# API it started, which the plugin reads from the launch environment. The Models
# settings page lists the route with its loaded model in the local servers card.
- insert:
    - id: llm-localcode
      name: '@deepseek-ai/dsh-llm-localcode'
    - id: ui-settings-local-servers
      name: '@deepseek-ai/dsh-client-ui-settings-local-servers'
